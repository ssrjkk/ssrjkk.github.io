# CodeQL бота: еженедельный анализ + пуш/PR в main, затрагивающий bot/ или workflow.
name: Bot CodeQL

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['bot/**', '.github/workflows/**']
  schedule:
    - cron: '40 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'actions']

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"